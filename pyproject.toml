[project]
name = "harnessup"
version = "0.1.2"
description = "Bootstraps coding-agent harnesses in cloud sandboxes from a repository manifest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harnessup = "harnessup.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.16.10", "pyrefly==1.3.2", "pytest==9.1.1"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
