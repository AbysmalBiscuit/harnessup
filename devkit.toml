#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
baseline_ref = "origin/main"
pr_create_state = "ready"
pr_proof_variable = "proof"

[tracker]
kind = "linear"

[harness]
enforce_writes = true
enforce_commands = true

[tasks.sync]
description = "Install the dev tools from uv.lock"
run = ["uv", "sync", "--locked"]
guard = true

[tasks.lint]
description = "Lint with ruff"
run = ["uv", "run", "ruff", "check"]
guard = true

[tasks.fmt]
description = "Format with ruff"
run = ["uv", "run", "ruff", "format"]
guard = true

[tasks.fmt-check]
description = "Check formatting with ruff"
run = ["uv", "run", "ruff", "format", "--check"]
guard = true

[tasks.typecheck]
description = "Type check with pyrefly"
run = ["uv", "run", "pyrefly", "check"]
guard = true

[tasks.test]
description = "Run the test suite with pytest"
run = ["uv", "run", "pytest"]
guard = true

[tasks.verify]
description = "Lint, check formatting and types, and test"
steps = [
    { task = "lint" },
    { task = "fmt-check" },
    { task = "typecheck" },
    { task = "test" },
]

[templates]
branch = '''
{%- set id = (ticket | lower ~ "-") if ticket else "" -%}
{%- set name = slug | trim | lower | replace(" ", "-") -%}
{{ id }}{{ name[:46 - (id | length)] | trim("-") }}
'''
worktree_dir = '''
{%- set id = (ticket | lower ~ "-") if ticket else "" -%}
{%- set name = slug | trim | lower | replace(" ", "-") -%}
{{ id }}{{ name[:46 - (id | length)] | trim("-") }}
'''

# PR body for `devkit pr create`; `input` comes from `--pr-body`.
# Only a human supplies `human_tldr`.
pr_body = '''
{%- set own = (ticket_magic_word ~ " " ~ ("#" if ticket and ticket[0] in "0123456789" else "") ~ ticket) if ticket else "" -%}
{%- set ref_lines = ((own ~ ";" ~ refs) if own else refs) | split(";") | map("trim") | reject("eq", "") | list -%}
{%- set agent = agent_model or agent_harness -%}
## TL;DR (human written)
{{ human_tldr }}
{%- if ref_lines %}

---

{{ ref_lines | join("\n") }}
{%- endif %}
{%- if agent %}

---

## Agent summary
{%- endif %}

{{ input | trim }}
{%- if proof | trim %}

## Proof

{{ proof | trim }}
{%- endif %}
{%- if agent %}

---
{%- if implemented_by | trim %}

Implemented by {{ implemented_by | trim }}
{%- endif %}

🤖 Generated with {{ agent_model }}{% if agent_model and agent_harness %} via {% endif %}{{ agent_harness }}
{%- endif %}
'''

# Ticket body for `ticket render`, `ticket create` and `ticket edit`;
# `input` comes from `--body`. Laid out as a prompt to the agent that works it.
ticket_body = '''
{{- input | trim }}
{%- if done_when | trim %}

## Done when

{{ done_when | trim }}
{%- endif %}
{%- if stop_and_ask | trim %}

## Stop and ask if

{{ stop_and_ask | trim }}
{%- endif %}
{%- if out_of_scope | trim %}

## Out of scope

{{ out_of_scope | trim }}
{%- endif %}
{%- if context | trim %}

## Context

{{ context | trim }}
{%- endif %}
'''

[templates.variables]
coauthors = { default = "", required = "agents", description = "`Name <email>` of each `Co-authored-by` trailer, one `--coauthor` apiece. Claude Code: `<full model name, e.g. Claude Opus 5> <noreply@anthropic.com>`. Codex: `Codex <noreply@openai.com>`" }

human_tldr = { default = "", description = "A human's summary, written after the PR opens; agents leave it unset" }
proof = { default = "", required = "agents", description = "One unindented line per `Done when` item, starting with its number in the order the issue lists them (`1. test foo_refuses_gap`, `2. command X and its output`), or with no issue one line per claim the summary makes; a numbered line indented two columns or more answers nothing. Each numbered line gives the evidence that its item holds: the test that covers it, a command and its output, or a screenshot or video under `.devkit/proof/` referenced by that local path (`![after](./.devkit/proof/after.png)`, a video path alone on its line) and passed to `devkit pr create --attach`" }

done_when = { default = "", required = "agents", description = "Checkbox list (`- [ ] ...`) of checks that prove the issue is done: a command that passes, behaviour anyone can see. For an investigation, the deliverable and where it goes. End each item with the proof its PR must show: `(proof: test <name>)`, `(proof: command and its output)`, `(proof: screenshot)` or `(proof: video)`. `--body` holds only the task: what to change and why, as behaviour rather than steps" }
stop_and_ask = { default = "", description = "Situations particular to this issue where the agent working it must stop and ask; being blocked and destructive actions are already covered. Leave unset when there are none" }
out_of_scope = { default = "", description = "Adjacent work that must not happen under this issue, even when it looks related" }
context = { default = "", description = "Links, error output, the parent and blocking issues. Attach screenshots rather than retyping them" }

# Supplied by the render context in a worktree `workspace setup` created; declared
# so the templates also render outside one.
ticket = { default = "", description = "The worktree's own issue id, filled in an issue worktree; pass it only outside one" }
ticket_magic_word = { default = "Closes", description = "Keyword on the worktree's own issue line: `Refs` when this branch does not finish the issue" }
refs = { default = "", description = "Every other issue line, `;`-separated, each with its own keyword: `Closes #12; Refs #90`" }

agent_model = { default = "", required = "agents", description = "Full name of the model that did the work, e.g. `Claude Opus 5`" }
agent_harness = { default = "", required = "agents", description = "Markdown link to the harness, e.g. `[Claude Code](https://claude.com/claude-code)`" }
implemented_by = { default = "", description = "One prose line naming who did which part, when several agents or people did the work" }
